version: 2

updates:
  # Package versions are centralized in Directory.Packages.props; Dependabot
  # discovers projects from the repository root and edits that file.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "Testcontainers*"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "Microsoft.Extensions.TimeProvider.Testing"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    ignore:
      # These three move together as a test-platform migration, not a version bump:
      # the 4.x visualstudio runner belongs to the xunit v3 line (this repo is on
      # v2), that line requires Microsoft.Testing.Platform, and the coverlet
      # collector is replaced rather than upgraded when leaving VSTest. Scheduling
      # that migration is a decision, so it is kept out of automated updates.
      - dependency-name: "xunit.runner.visualstudio"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet.collector"

  # Keeps both tag references and SHA pins (with their trailing version
  # comment) current across .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
